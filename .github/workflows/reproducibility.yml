name: Stata repository checks

on:
  push:
    branches: [main]
    paths-ignore:
      - data/ACQUIRE_DATA
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ["Acquire source data"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  static-validation:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    name: Validate project structure and analysis specification
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Validate required files and documented workflow
        shell: bash
        run: |
          set -euo pipefail

          for path in \
            README.md \
            LICENSE \
            .gitignore \
            .gitattributes \
            .github/workflows/data-acquisition.yml \
            data/README.md \
            data/DATA_VINTAGE.md \
            data/raw.sha256 \
            data/raw/bis_credit_gap.csv \
            data/raw/wb_gdp_growth.zip \
            data/raw/wb_cpi_inflation.zip \
            docs/DATA_AUDIT.md \
            docs/RESEARCH_DESIGN.md \
            docs/LITERATURE_NOTES.md \
            docs/REPRODUCIBILITY.md \
            docs/RESULTS.md \
            outputs/README.md \
            replication/balanced_panel_sensitivity.do \
            replication/denominator_diagnostic.do \
            replication/download_denominator_sources.ps1 \
            replication/download_data.do \
            replication/download_nominal_gdp.ps1 \
            replication/inference_diagnostics.do \
            replication/run_analysis.do \
            replication/validate_nominal_gdp.do \
            replication/validate_balanced_panel_samples.do \
            replication/audit_nominal_gdp_linked.do \
            replication/download_linked_nominal_gdp.ps1 \
            replication/validate_nominal_gdp_linked.do; do
            if [[ ! -s "$path" ]]; then
              echo "::error::Missing or empty required file: $path"
              exit 1
            fi
          done

          test -n "$(find data/raw -maxdepth 1 -type f -name 'API_NY.GDP.MKTP.KD.ZG*.csv' -print -quit)"
          test -n "$(find data/raw -maxdepth 1 -type f -name 'API_FP.CPI.TOTL.ZG*.csv' -print -quit)"

          grep -Fq "Financial Cycles and Macroeconomic Fluctuations: Cross-Country Evidence from Credit-to-GDP Gaps" README.md
          grep -Fq "do replication/download_data.do" README.md
          grep -Fq "do replication/run_analysis.do" README.md
          grep -Fq "docs/RESEARCH_DESIGN.md" README.md
          grep -Fq "docs/LITERATURE_NOTES.md" README.md
          grep -Fq "docs/REPRODUCIBILITY.md" README.md
          grep -Fq "docs/RESULTS.md" README.md
          grep -Fq "replication/inference_diagnostics.do" README.md
          grep -Fq "replication/denominator_diagnostic.do" README.md
          grep -Fq "replication/validate_nominal_gdp.do" README.md
          grep -Fq "replication/validate_nominal_gdp_linked.do" README.md
          grep -Fq "replication/audit_nominal_gdp_linked.do" README.md
          grep -Fq "replication/download_linked_nominal_gdp.ps1" data/README.md
          grep -Fq "replication/balanced_panel_sensitivity.do" README.md
          grep -Fq "replication/validate_balanced_panel_samples.do" README.md

          grep -Fq "version 15.1" replication/download_data.do
          grep -Fq "version 15.1" replication/run_analysis.do
          grep -Fq "WS_CREDIT_GAP" replication/download_data.do
          grep -Fq "NY.GDP.MKTP.KD.ZG" replication/download_data.do
          grep -Fq "FP.CPI.TOTL.ZG" replication/download_data.do
          grep -Fq "Q..P.A.C" replication/download_data.do

          grep -Fq "keep if tc_borrowers == \"P\"" replication/run_analysis.do
          grep -Fq "keep if tc_lenders == \"A\"" replication/run_analysis.do
          grep -Fq "keep if cg_dtype == \"C\"" replication/run_analysis.do
          grep -Fq "keep if quarter == 4" replication/run_analysis.do
          grep -Fq "F1.gdp_growth" replication/run_analysis.do
          grep -Fq "F2.gdp_growth" replication/run_analysis.do
          grep -Fq "F3.gdp_growth" replication/run_analysis.do
          grep -Fq "i.outcome_year_h1" replication/run_analysis.do
          grep -Fq "vce(cluster panel_id)" replication/run_analysis.do
          grep -Fq "version 15.1" replication/inference_diagnostics.do
          grep -Fq "which boottest" replication/inference_diagnostics.do
          grep -Fq "capture noisily run" replication/inference_diagnostics.do
          grep -Fq "boottest credit_gap_q4" replication/inference_diagnostics.do
          grep -Fq "boottest gap_positive" replication/inference_diagnostics.do
          grep -Fq "boottest gap_negative" replication/inference_diagnostics.do
          grep -Fq "boottest gap_positive = gap_negative" replication/inference_diagnostics.do
          grep -Fq "reps(9999)" replication/inference_diagnostics.do
          grep -Fq "weight(rademacher)" replication/inference_diagnostics.do
          grep -Fq "wild_cluster_bootstrap.txt" replication/inference_diagnostics.do
          grep -Fq "version 15.1" replication/denominator_diagnostic.do
          grep -Fq "version 15.1" replication/balanced_panel_sensitivity.do
          grep -Fq 'local validation_if "balanced31 == 1 & inrange(year, 2006, 2024)"' replication/balanced_panel_sensitivity.do
          grep -Fq "local expected_growth = 589" replication/balanced_panel_sensitivity.do
          grep -Fq "local expected_growth = 817" replication/balanced_panel_sensitivity.do
          grep -Fq "version 15.1" replication/validate_balanced_panel_samples.do
          grep -Fq 'local level_if "balanced31 == 1 & level_overlap == 1 & inrange(year, 2006, 2024)"' replication/validate_balanced_panel_samples.do
          grep -Fq 'local growth_if "balanced31 == 1 & growth_overlap == 1 & inrange(year, 2006, 2024)"' replication/validate_balanced_panel_samples.do
          grep -Fq 'local growth_if "growth_overlap == 1 & inrange(year, 2006, 2024)"' replication/validate_balanced_panel_samples.do
          grep -Fq "local expected_growth = 589" replication/validate_balanced_panel_samples.do
          grep -Fq "local expected_growth = 817" replication/validate_balanced_panel_samples.do
          grep -Fq "balanced_panel_linked_gdp_validation.csv" replication/validate_balanced_panel_samples.do
          grep -Fq "version 15.1" replication/validate_nominal_gdp.do
          grep -Fq "NY.GDP.MKTP.CN" replication/validate_nominal_gdp.do
          grep -Fq "download_nominal_gdp.ps1" replication/validate_nominal_gdp.do
          grep -Fq "NY.GDP.MKTP.CN" replication/download_nominal_gdp.ps1
          grep -Fq "NY.GDP.MKTP.CN.AD" replication/download_linked_nominal_gdp.ps1
          grep -Fq "Indicator Code" replication/download_linked_nominal_gdp.ps1
          grep -Fq "Archive SHA-256" replication/download_linked_nominal_gdp.ps1
          grep -Fq "CSV SHA-256" replication/download_linked_nominal_gdp.ps1
          grep -Fq "NY.GDP.MKTP.CN.AD" replication/validate_nominal_gdp_linked.do
          grep -Fq "download_linked_nominal_gdp.ps1" replication/validate_nominal_gdp_linked.do
          grep -Fq 'trim(v4) != "NY.GDP.MKTP.CN.AD"' replication/validate_nominal_gdp_linked.do
          grep -Fq 'trim(v4) != "NY.GDP.MKTP.CN"' replication/validate_nominal_gdp.do
          grep -Fq "nominal_gdp_linked_level_outliers_top20.csv" replication/audit_nominal_gdp_linked.do
          grep -Fq "nominal_gdp_linked_growth_outliers_top20.csv" replication/audit_nominal_gdp_linked.do
          grep -Fq "download_denominator_sources.ps1" replication/denominator_diagnostic.do
          if grep -Fq "need_download" replication/denominator_diagnostic.do; then
            echo "::error::Obsolete need_download logic remains in denominator_diagnostic.do"
            exit 1
          fi
          test "$(grep -Fc 'shell powershell.exe' replication/denominator_diagnostic.do)" -eq 1
          grep -Fq "Invoke-WebRequest" replication/download_denominator_sources.ps1
          grep -Fq "bis_credit_gap_ratio.csv" replication/download_denominator_sources.ps1
          grep -Fq "bis_total_credit_xdc.csv" replication/download_denominator_sources.ps1
          grep -Fq "WS_CREDIT_GAP/1.0/Q..P.A.A" replication/denominator_diagnostic.do
          grep -Fq "WS_CREDIT_GAP/1.0/Q..P.A.B" replication/denominator_diagnostic.do
          grep -Fq "WS_TC/2.0/Q..P.A.M.XDC.A" replication/denominator_diagnostic.do
          grep -Fq "WS_TC/2.0/Q..P.A.M.770.A" replication/denominator_diagnostic.do
          grep -Fq "tostring unit_type, replace force" replication/denominator_diagnostic.do
          grep -Fq "implied_nominal_gdp_4q" replication/denominator_diagnostic.do
          grep -Fq "credit_growth_nominal" replication/denominator_diagnostic.do
          grep -Fq "nominal_gdp_growth_implied" replication/denominator_diagnostic.do
          grep -Fq "ratio_identity_error" replication/denominator_diagnostic.do
          grep -Fq "abs_ratio_source_difference" replication/denominator_diagnostic.do
          grep -Fq "abs_gap_reconstruction_error" replication/denominator_diagnostic.do
          grep -Fq "exit 459" replication/denominator_diagnostic.do
          grep -Fq "ratio_component_growth" replication/denominator_diagnostic.do
          grep -Fq "ratio_component_coefficients" replication/denominator_diagnostic.do
          if grep -Fq "wildbootstrap xtreg" replication/inference_diagnostics.do; then
            echo "::error::Obsolete built-in wildbootstrap command remains in the optional diagnostic."
            exit 1
          fi
          grep -Fq "gdp_growth_lag1" replication/run_analysis.do
          grep -Fq "estimates store NO_LAG" replication/run_analysis.do
          grep -Fq "estimates store NO_INFLATION" replication/run_analysis.do
          grep -Fq "NO_IRL_LUX" replication/run_analysis.do
          grep -Fq "ASYM_NO_IRL" replication/run_analysis.do
          grep -Fq "ASYM_NO_LUX" replication/run_analysis.do
          grep -Fq "ASYM_NO_IRL_LUX" replication/run_analysis.do
          grep -Fq "influence_sensitivity.txt" replication/run_analysis.do
          grep -Fq "set scheme s1mono" replication/run_analysis.do
          grep -Fq "name(mean_credit_gap_by_year, replace)" replication/run_analysis.do
          grep -Fq "name(credit_gap_gdp_scatter, replace)" replication/run_analysis.do
          grep -Fq "name(fe_horizon_coefficients, replace)" replication/run_analysis.do
          grep -Fq "name(asymmetric_gap_coefficients, replace)" replication/run_analysis.do
          grep -Fq 'name(mean_credit_gap_by_year) replace width(2000)' replication/run_analysis.do
          grep -Fq 'name(credit_gap_gdp_scatter) replace width(2000)' replication/run_analysis.do
          grep -Fq 'name(fe_horizon_coefficients) replace width(2000)' replication/run_analysis.do
          grep -Fq 'name(asymmetric_gap_coefficients) replace width(2000)' replication/run_analysis.do
          grep -Fq 'graph save mean_credit_gap_by_year' replication/run_analysis.do
          grep -Fq 'graph save credit_gap_gdp_scatter' replication/run_analysis.do
          grep -Fq 'graph save fe_horizon_coefficients' replication/run_analysis.do
          grep -Fq 'graph save asymmetric_gap_coefficients' replication/run_analysis.do
          grep -Fq 'outputs/figures/fe_horizon_coefficients.gph' replication/run_analysis.do
          grep -Fq 'outputs/figures/asymmetric_gap_coefficients.gph' replication/run_analysis.do
          grep -Fq 'graph dir' replication/run_analysis.do
          grep -Fq "gap_positive" replication/run_analysis.do
          grep -Fq "gap_negative" replication/run_analysis.do
          grep -Fq 'insheet using "data/raw/bis_credit_gap.csv", comma names clear' replication/run_analysis.do
          grep -Fq 'comma nonames clear' replication/run_analysis.do
          grep -Fq 'drop in 1/3' replication/run_analysis.do
          if grep -Eq '^[[:space:]]*import delimited' replication/run_analysis.do; then
            echo "::error::Java-dependent import delimited command remains in the Stata analysis script."
            exit 1
          fi

          grep -Fq "No causal identification." docs/RESEARCH_DESIGN.md
          grep -Fq "1,310" docs/DATA_AUDIT.md
          grep -Fq "Argentina" docs/DATA_AUDIT.md
          sha256sum --check data/raw.sha256
          grep -Fq "one-sided" docs/RESEARCH_DESIGN.md
          grep -Fq "denominator" docs/RESEARCH_DESIGN.md

          tracked_non_stata="$(git ls-files -- '*.py' '*.R' '*.r' '*.m')"
          if [[ -n "$tracked_non_stata" ]]; then
            echo "::error::Unexpected non-Stata source files in this Stata project:"
            echo "$tracked_non_stata"
            exit 1
          fi

          echo "Static repository checks passed. This workflow does not execute Stata or validate numerical estimates."

  windows-bis-download:
    name: Validate Windows BIS and World Bank source acquisition
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Download and validate supplementary BIS and WDI series
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          .\replication\download_denominator_sources.ps1

          $expected = @(
            "bis_credit_gap_ratio.csv",
            "bis_credit_gap_trend.csv",
            "bis_total_credit_xdc.csv",
            "bis_total_credit_gdp.csv"
          )

          foreach ($name in $expected) {
            $path = Join-Path "data/raw" $name
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Missing downloaded BIS file: $path"
            }
            if ((Get-Item -LiteralPath $path).Length -lt 100) {
              throw "Downloaded BIS file is unexpectedly small: $path"
            }
          }

          function Assert-WdiSource {
            param(
              [string]$Indicator,
              [string]$CsvPath,
              [string]$ArchivePath,
              [string]$MetadataPath
            )

            foreach ($path in @($CsvPath, $ArchivePath, $MetadataPath)) {
              if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
                throw "Missing World Bank source artifact: $path"
              }
            }

            if ((Get-Item -LiteralPath $CsvPath).Length -lt 1000) {
              throw "World Bank CSV is unexpectedly small: $CsvPath"
            }

            $metadataLines = @(Get-Content -LiteralPath $MetadataPath)
            if ("Indicator: $Indicator" -notin $metadataLines) {
              throw "Metadata does not identify the expected indicator $Indicator."
            }

            $actualCsvHash = (Get-FileHash -LiteralPath $CsvPath -Algorithm SHA256).Hash
            $actualArchiveHash = (Get-FileHash -LiteralPath $ArchivePath -Algorithm SHA256).Hash
            if ("CSV SHA-256: $actualCsvHash" -notin $metadataLines) {
              throw "CSV checksum in metadata does not match $CsvPath."
            }
            if ("Archive SHA-256: $actualArchiveHash" -notin $metadataLines) {
              throw "Archive checksum in metadata does not match $ArchivePath."
            }
          }

          .\replication\download_nominal_gdp.ps1
          $nominalMetaBefore = (Get-FileHash -LiteralPath "data/raw/wb_gdp_current_lcu_metadata.txt" -Algorithm SHA256).Hash
          $nominalCsvBefore = (Get-FileHash -LiteralPath "data/raw/wb_gdp_current_lcu.csv" -Algorithm SHA256).Hash
          $nominalArchiveBefore = (Get-FileHash -LiteralPath "data/raw/wb_gdp_current_lcu.zip" -Algorithm SHA256).Hash
          Assert-WdiSource -Indicator "NY.GDP.MKTP.CN" -CsvPath "data/raw/wb_gdp_current_lcu.csv" -ArchivePath "data/raw/wb_gdp_current_lcu.zip" -MetadataPath "data/raw/wb_gdp_current_lcu_metadata.txt"
          .\replication\download_nominal_gdp.ps1
          $nominalMetaAfter = (Get-FileHash -LiteralPath "data/raw/wb_gdp_current_lcu_metadata.txt" -Algorithm SHA256).Hash
          $nominalCsvAfter = (Get-FileHash -LiteralPath "data/raw/wb_gdp_current_lcu.csv" -Algorithm SHA256).Hash
          $nominalArchiveAfter = (Get-FileHash -LiteralPath "data/raw/wb_gdp_current_lcu.zip" -Algorithm SHA256).Hash
          if ($nominalMetaBefore -ne $nominalMetaAfter -or $nominalCsvBefore -ne $nominalCsvAfter -or $nominalArchiveBefore -ne $nominalArchiveAfter) {
            throw "The unlinked WDI downloader changed validated source files or provenance metadata on a no-refresh rerun."
          }

          .\replication\download_linked_nominal_gdp.ps1
          $linkedMetaBefore = (Get-FileHash -LiteralPath "data/raw/wb_gdp_linked_current_lcu_metadata.txt" -Algorithm SHA256).Hash
          $linkedCsvBefore = (Get-FileHash -LiteralPath "data/raw/wb_gdp_linked_current_lcu.csv" -Algorithm SHA256).Hash
          $linkedArchiveBefore = (Get-FileHash -LiteralPath "data/raw/wb_gdp_linked_current_lcu.zip" -Algorithm SHA256).Hash
          Assert-WdiSource -Indicator "NY.GDP.MKTP.CN.AD" -CsvPath "data/raw/wb_gdp_linked_current_lcu.csv" -ArchivePath "data/raw/wb_gdp_linked_current_lcu.zip" -MetadataPath "data/raw/wb_gdp_linked_current_lcu_metadata.txt"
          .\replication\download_linked_nominal_gdp.ps1
          $linkedMetaAfter = (Get-FileHash -LiteralPath "data/raw/wb_gdp_linked_current_lcu_metadata.txt" -Algorithm SHA256).Hash
          $linkedCsvAfter = (Get-FileHash -LiteralPath "data/raw/wb_gdp_linked_current_lcu.csv" -Algorithm SHA256).Hash
          $linkedArchiveAfter = (Get-FileHash -LiteralPath "data/raw/wb_gdp_linked_current_lcu.zip" -Algorithm SHA256).Hash
          if ($linkedMetaBefore -ne $linkedMetaAfter -or $linkedCsvBefore -ne $linkedCsvAfter -or $linkedArchiveBefore -ne $linkedArchiveAfter) {
            throw "The linked WDI downloader changed validated source files or provenance metadata on a no-refresh rerun."
          }

          Write-Host "Windows BIS and World Bank source checks, including linked GDP and downloader idempotence, passed."
